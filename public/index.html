<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PuzzleSync ✨</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="mesh-bg" aria-hidden="true"></div>

  <main class="cockpit">
    <header class="hud">
      <span class="brand">✨ PuzzleSync</span>
      <div class="hud-right">
        <button class="btn-ghost" id="inviteBtn">🔗 Copy Invite</button>
        <span class="progress" id="progress">0 / 12 placed</span>
        <button class="btn-ghost" id="resetBtn" title="Reshuffle">↻</button>
      </div>
    </header>

    <section class="stage">
      <div class="board-container">
        <div class="board" id="board"></div>
      </div>
      <div class="tray-container">
        <div class="tray-label">Loose Pieces</div>
        <div class="tray" id="tray"></div>
      </div>
    </section>
  </main>

  <div class="overlay hidden" id="solvedOverlay">
    <div class="overlay-card">
      <h2>yay, you solved it! ✨</h2>
      <p class="sub">nice work, bestie 💜</p>
      <button class="btn-primary" id="playAgainBtn">play again</button>
    </div>
  </div>

  <!-- Socket.io Client -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
